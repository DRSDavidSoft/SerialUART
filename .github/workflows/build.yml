name: Build, test and package
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: ${{ matrix.target }} / ${{ matrix.linkage }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64-gcc, linux-x64-clang, linux-arm64-gcc, macos-arm64-clang, windows-x64-msvc]
        linkage: [static, shared]
        include:
          - os: ubuntu-24.04
            target: linux-x64-gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            target: linux-x64-clang
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04-arm
            target: linux-arm64-gcc
            cc: gcc
            cxx: g++
          - os: macos-15
            target: macos-arm64-clang
            cc: clang
            cxx: clang++
          - os: windows-2025
            target: windows-x64-msvc
            cc: cl
            cxx: cl
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          LINKAGE: ${{ matrix.linkage }}
        run: |
          shared=OFF
          if [[ "$LINKAGE" == shared ]]; then shared=ON; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS="$shared"
      - name: Build and test
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure
      - name: Package and checksums
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LINKAGE: ${{ matrix.linkage }}
        run: |
          cmake --install build --config Release --prefix stage
          python tests/package_smoke.py stage
          cd build
          cpack -C Release -G ZIP -B ../dist -D "CPACK_PACKAGE_FILE_NAME=SerialUART-$TARGET-$LINKAGE"
          cd ..
          python tools/checksums.py dist
      - name: Official Socket.IO client and heartbeat interoperability
        if: matrix.target == 'linux-x64-gcc' && matrix.linkage == 'static'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/socketio" --ignore-scripts --no-audit --no-fund socket.io-client@4.8.1
          node tests/socketio_client.mjs "$RUNNER_TEMP/socketio" build/network_echo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SerialUART-${{ matrix.target }}-${{ matrix.linkage }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  armv7:
    name: Raspberry Pi ARMv7 / GCC + QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user
      - name: Cross build and execute tests
        env:
          SUART_EMULATOR: qemu-arm -L /usr/arm-linux-gnueabihf
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/armv7-linux.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          cd build
          cpack -G ZIP -B ../dist -D CPACK_PACKAGE_FILE_NAME=SerialUART-linux-armv7-gcc-static
          cd ..
          python3 tools/checksums.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SerialUART-linux-armv7-gcc-static
          path: dist/*
          if-no-files-found: error
  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test with ASan and UBSan
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
  complete:
    name: SerialUART complete
    if: always()
    needs: [build, armv7, sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - env:
          BUILDS: ${{ needs.build.result }}
          ARMV7: ${{ needs.armv7.result }}
          SANITIZERS: ${{ needs.sanitizers.result }}
        run: |
          printf '| Stage | Result |\n|---|---|\n| Native builds, integration tests and packages | %s |\n| ARMv7 emulated tests | %s |\n' "$BUILDS" "$ARMV7" >> "$GITHUB_STEP_SUMMARY"
          echo 'CI does not prove USB enumeration, Arduino reset timing or physical Raspberry Pi operation.' >> "$GITHUB_STEP_SUMMARY"
          [[ "$BUILDS" == success && "$ARMV7" == success && "$SANITIZERS" == success ]]
  release:
    name: Draft checksummed release
    needs: [complete]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: SerialUART-*
          path: incoming
      - name: Validate and stage release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/release.py incoming release "$RELEASE_TAG"
      - name: Create immutable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --draft --generate-notes
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release/*.zip
